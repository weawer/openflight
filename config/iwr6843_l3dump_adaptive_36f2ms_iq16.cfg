% Experimental Phase 4: 36 frames at 2 ms, all 12 loops and 3 TX / 4 RX.
% Pre/impact window origins are calibrated to this radar's measured range
% bias: a stationary corner reflector at 1.20 m and 1.845 m both centroided
% at +1.5 to +1.8 bins (~7-8 cm) beyond the nominal profileCfg range-FFT
% mapping (~4.684 cm/bin), consistent with RF group delay/cabling rather
% than a scale error. Applied as a uniform +2 bin shift to preStart and
% impactStart (window widths unchanged; those are tied to the validated
% memory/timing budget). See the 2026-09-26 calibration captures under
% openflight_sessions/iwr-adaptive-coherent2-stationary(_120cm)/ and
% plans/iwr-iq16-2ms-onboard-retention.md. This still assumes a ~1.7-1.8 m
% tee; re-run the calibration if the radar mount or tee position changes.
dfeDataOutputMode 1
channelCfg 15 7 0
adcCfg 2 1
profileCfg 0 60.0 7 3 38 0 0 100 1 128 4000 0 0 30
chirpCfg 0 0 0 0 0 0 0 1
chirpCfg 1 1 0 0 0 0 0 2
chirpCfg 2 2 0 0 0 0 0 4
frameCfg 0 2 12 0 2 1 0
captureFormat adaptive16
phaseCaptureCfg 22 32 14 34 53 6 47 12 47 16 1
lowPower 0 0
sensorStart
