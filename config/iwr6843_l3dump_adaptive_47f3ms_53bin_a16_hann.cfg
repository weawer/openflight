% The 3 ms adaptive IQ16 profile (iwr6843_l3dump_adaptive_47f3ms_53bin_a16.cfg)
% with the detector scoring bins through a periodic Hann range window
% ("trackCfg window hann", l3_iq16_stats.h): a strong return's sidelobes drop
% from about -13 dB to -31 dB so a weak ball a few bins away is not buried,
% at the cost of a main lobe twice as wide. Stored samples are unchanged, so
% the saved movie is the plain profile's. Needs firmware with the range
% window; older firmware answers "Error" to the window line and the config is
% refused before sensorStart.
dfeDataOutputMode 1
channelCfg 15 7 0
adcCfg 2 1
profileCfg 0 60.0 7 3 38 0 0 100 1 128 4000 0 0 30
chirpCfg 0 0 0 0 0 0 0 1
chirpCfg 1 1 0 0 0 0 0 2
chirpCfg 2 2 0 0 0 0 0 4
frameCfg 0 2 12 0 3 1 0
captureFormat adaptive16
captureCfg retain 16 24 16
phaseCaptureCfg 20 53 24 32 53 7 47 53 47 16 1
trackCfg window hann
lowPower 0 0
sensorStart
