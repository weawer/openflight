% Adaptive IQ16 at 2 ms with the Hann window (2026-10-01, experimental).
% The default 2 ms Hann profile's RF (same profileCfg, chirps and frameCfg)
% with captureFormat adaptive16: the detect task still reads the 53-bin
% processing windows at full IQ16 precision, and L3 keeps only the bins the
% retention policy (l3_retain.c) places around the club, impact and ball:
% 16 pre, 24 impact and 16 post bins per frame. That buys the firmware's
% 64-frame maximum (L3_MAX_CAPTURE_FRAMES) instead of 24: 24 pre frames
% (48 ms of approach), the same 7 impact frames, and 33 ball frames (66 ms),
% 128 ms in all. L3 used: 1080 retained bins x 576 B = 622,080 of 786,432 B.
% Not yet proven on hardware at 2 ms: soak it with iwr6843_cadence_soak.py;
% stats scratch_stale must stay 0 (the detect task inside one 2 ms frame) and
% compact max_us plus the rearm must fit the idle gap (hwa_missed at the wide
% profile's rate). The window persists on the board until power-off or
% another 'captureCfg window'. Needs firmware with the compact formats and
% l3_window; older firmware answers "Error" and the config is refused.
dfeDataOutputMode 1
channelCfg 15 7 0
adcCfg 2 1
profileCfg 0 60.0 7 3 38 0 0 100 1 128 4000 0 0 30
chirpCfg 0 0 0 0 0 0 0 1
chirpCfg 1 1 0 0 0 0 0 2
chirpCfg 2 2 0 0 0 0 0 4
frameCfg 0 2 12 0 2 1 0
captureFormat adaptive16
captureCfg window hann
captureCfg retain 16 24 16
phaseCaptureCfg 20 53 24 32 53 7 47 53 47 33 1
lowPower 0 0
sensorStart
