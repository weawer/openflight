% Adaptive IQ16 profile: identical to
% iwr6843_l3dump_adaptive_47f3ms_53bin_a16.cfg except the frame period
% (frameCfg's 5th field, 3 -> 2 ms). Same profileCfg/chirpCfg/loop count, so
% the per-chirp timing this depends on is unchanged from what the 3 ms
% profile already validated on hardware (scratch_stale=0, rearm_max_us=43,
% 0 missed frames over 50,001 frames) -- only the detect task's per-frame
% deadline shrinks, from 3000 us to 2000 us. That is the one thing this
% profile exists to test; run the same cadence soak against it before any
% real-shot session.
%
% 16 pre, 24 impact and 16 post bins per frame; 24 pre frames (48 ms of
% approach), 7 impact frames and 16 ball frames at 2 ms, 47 frames in all.
% Needs firmware with the compact formats (captureFormat adaptive16); older
% firmware answers "Error" to captureFormat and the config is refused
% before sensorStart.
dfeDataOutputMode 1
channelCfg 15 7 0
adcCfg 2 1
profileCfg 0 60.0 7 3 38 0 0 100 1 128 4000 0 0 30
chirpCfg 0 0 0 0 0 0 0 1
chirpCfg 1 1 0 0 0 0 0 2
chirpCfg 2 2 0 0 0 0 0 4
frameCfg 0 2 12 0 2 1 0
captureFormat adaptive16
captureCfg retain 16 24 16
phaseCaptureCfg 20 53 24 32 53 7 47 53 47 16 1
lowPower 0 0
sensorStart
